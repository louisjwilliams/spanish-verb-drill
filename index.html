// ── Storage helpers (localStorage) ───────────────────────────────────────────

function defSaved() {
  const vs = {};
  VERB_KEYS.forEach(v => { vs[v] = { correct: 0, wrong: 0 }; });
  return {
    theme: "dark", activeVerbs: [...VERB_KEYS], activeTenses: ["present","preterite"],
    allTimeCorrect: 0, allTimeWrong: 0, sessions: 0, bestStreak: 0, verbStats: vs,
    cellStats: {}, sessionHistory: [],
    queueMode: true, mcMode: false, timerMode: false,
  };
}

function cellKey(verb, tense) { return `${verb}|${tense}`; }
function getCellStat(cellStats, verb, tense) { return cellStats[cellKey(verb, tense)] || { correct: 0, wrong: 0 }; }

// Merge a raw saved-data object (from localStorage or the cloud) onto today's defaults,
// so older/partial data never crashes newer code that expects fields it didn't have yet.
function mergeSaved(raw) {
  const base = defSaved();
  const merged = { ...base, ...raw };
  VERB_KEYS.forEach(v => { if (!merged.verbStats[v]) merged.verbStats[v] = { correct: 0, wrong: 0 }; });
  return merged;
}

async function loadFromStorage() {
  try {
    const raw = window.localStorage.getItem("spanish-drill-v2");
    if (raw) return mergeSaved(JSON.parse(raw));
  } catch(e) {}
  return defSaved();
}

async function saveToStorage(data) {
  try { window.localStorage.setItem("spanish-drill-v2", JSON.stringify(data)); } catch(e) {}
}

  const { error } = await supabaseClient.from("drill_stats").upsert({ user_id: userId, data: payload, updated_at: new Date().toISOString() });
  if (error) { console.error("saveToCloud", error); return false; }
  return true;
}

// ── Shuffle ─────────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue(activeVerbs, activeTenses) {
  const items = [];
  activeVerbs.forEach(v => activeTenses.forEach(t => SUBJS.forEach(s => items.push({ verb: v, tense: t, subject: s }))));
  return shuffle(items);
}

// Weighted shuffle (Efraimidis-Spirakis): items with more wrong answers / fewer
// correct ones for their (verb, tense) cell get a higher chance of sorting earlier,
// without changing how many cards are in the round.
function buildQueueSmart(activeVerbs, activeTenses, cellStats) {
  const items = [];
  activeVerbs.forEach(v => activeTenses.forEach(t => {
    const cell = getCellStat(cellStats, v, t);
    const weight = Math.max(1, 1 + cell.wrong * 2 - cell.correct * 0.3);
    SUBJS.forEach(s => items.push({ verb: v, tense: t, subject: s, weight }));
  }));
  return items
    .map(it => ({ it, key: Math.pow(Math.random(), 1 / it.weight) }))
    .sort((a, b) => b.key - a.key)
    .map(({ it }) => ({ verb: it.verb, tense: it.tense, subject: it.subject }));
}

// Deterministic shuffle keyed by a string seed, so multiple-choice option order
// stays stable across re-renders of the same card instead of reshuffling on every keystroke.
function seedHash(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return h;
}

function seededShuffle(arr, seed) {
  let h = seedHash(seed);
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    h = (h * 1664525 + 1013904223) >>> 0;
    const j = h % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChoices(cur) {
  const answer = VERBS[cur.verb][cur.tense][cur.subject];
  const seed = `${cur.verb}|${cur.tense}|${cur.subject}`;

  // Same-verb distractors: other conjugations of THIS verb (any tense, any subject) — these
  // share the stem/spelling pattern, so picking one means actually knowing the subject/tense,
  // not just recognizing which verb is being conjugated.
  const sameVerbPool = new Set();
  TENSES.forEach(t => SUBJS.forEach(s => {
    const val = VERBS[cur.verb][t][s];
    if (val !== answer) sameVerbPool.add(val);
  }));

  // Different-verb distractors: other verbs' forms for the same tense, so they still read
  // plausibly in the sentence.
  const otherVerbPool = new Set();
  VERB_KEYS.forEach(v => {
    if (v === cur.verb) return;
    SUBJS.forEach(s => {
      const val = VERBS[v][cur.tense][s];
      if (val !== answer) otherVerbPool.add(val);
    });
  });

  // How many of the 3 distractors come from the same verb this round — deterministic per
  // card (stable across re-renders) but varies card to card, so it's sometimes 0 and
  // sometimes 2-3, not a fixed count every time.
  const roll = seedHash(seed + "count") % 100;
  const sameCount = roll < 25 ? 0 : roll < 55 ? 1 : roll < 85 ? 2 : 3;

  const sameDistractors = seededShuffle([...sameVerbPool], seed + "same").slice(0, sameCount);
  const remaining = 3 - sameDistractors.length;
  const otherDistractors = seededShuffle([...otherVerbPool], seed + "other").slice(0, remaining);

  return seededShuffle([answer, ...sameDistractors, ...otherDistractors], seed + "x");
}

function StatBox({ num, label, theme }) {

}

function ConjTable({ verb, theme }) {

function TimerBar({ duration, onExpire, theme }) {
  const [full, setFull] = useState(true);
  useEffect(() => {
    const raf = requestAnimationFrame(() => setFull(false));
    const timeout = setTimeout(onExpire, duration * 1000);
    return () => { cancelAnimationFrame(raf); clearTimeout(timeout); };
  }, []);
  return (
    <div style={{ height: 4, background: theme.borderColor, borderRadius: 2, marginBottom: 10, overflow: "hidden" }}>
      <div style={{ height: "100%", width: full ? "100%" : "0%", background: theme.noteBorder, borderRadius: 2, transition: `width ${duration}s linear` }} />
    </div>
  );
}

function pctColor(p, theme) {
  return p >= 80 ? theme.correctBorder : p >= 50 ? theme.noteBorder : theme.wrongBorder;
}

function ProgressRing({ pct, theme, size = 96, stroke = 10 }) {
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - pct / 100);
  const color = pctColor(pct, theme);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`${pct}% correct`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={theme.borderColor} strokeWidth={stroke} />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset .6s ease" }}
      />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central" fontSize={size * 0.26} fontWeight="700" fill={theme.text}>
        {pct}%
      </text>
    </svg>
  );
}

// Rounded-top bar path — the top (non-baseline) end is rounded, the bottom stays flush to the axis.
function roundedTopRectPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}

function SessionChart({ history, theme }) {
  if (!history || history.length === 0) {
    return <div style={{ fontSize: 12, color: theme.textMuted, padding: "10px 0" }}>Complete a round to start tracking your trend.</div>;
  }
  const recent = history.slice(-14);
  const w = 320, h = 90, padTop = 14, padBottom = 4, barGap = 4;
  const barW = (w - barGap * (recent.length - 1)) / recent.length;
  const avg = Math.round(recent.reduce((s, x) => s + x.pct, 0) / recent.length);
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 90, display: "block" }} role="img" aria-label={`Accuracy over the last ${recent.length} sessions, average ${avg} percent`}>
        <line x1="0" y1={h - padBottom} x2={w} y2={h - padBottom} stroke={theme.borderColor} strokeWidth="1" />
        {recent.map((s, i) => {
          const barH = Math.max(2, (s.pct / 100) * (h - padTop - padBottom));
          const x = i * (barW + barGap);
          const y = h - padBottom - barH;
          const color = pctColor(s.pct, theme);
          return (
            <g key={i}>
              <path d={roundedTopRectPath(x, y, barW, barH, 3)} fill={color} />
              <title>{`${new Date(s.date).toLocaleDateString()} — ${s.pct}% (${s.correct}/${s.correct + s.wrong})`}</title>
              {recent.length <= 10 && (
                <text x={x + barW / 2} y={y - 4} textAnchor="middle" fontSize="8" fill={theme.textMuted}>{s.pct}</text>
              )}
            </g>
          );
        })}
      </svg>
      <div style={{ fontSize: 11, color: theme.textMuted, marginTop: 4, display: "flex", justifyContent: "space-between" }}>
        <span>Last {recent.length} session{recent.length !== 1 ? "s" : ""}</span>
        <span>avg {avg}%</span>
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────────

function App() {
  const [saved, setSaved] = useState(null);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [mcMode, setMcMode] = useState(false);
  const [queueMode, setQueueMode] = useState(true);
  const [timerMode, setTimerMode] = useState(false);
  const [activeVerbs, setActiveVerbs] = useState(new Set(VERB_KEYS));
  const [activeTenses, setActiveTenses] = useState(new Set(["present","preterite"]));
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [sessionScore, setSessionScore] = useState(0);
  const [sessionWrong, setSessionWrong] = useState(0);
  const [streak, setStreak] = useState(0);
  const [answered, setAnswered] = useState(false);
  const [inputVal, setInputVal] = useState("");
  const [result, setResult] = useState(null); // null | "correct" | "wrong"
  const [showTable, setShowTable] = useState(false);
  const [showNote, setShowNote] = useState(false);
  const [panel, setPanel] = useState("drill"); // "drill" | "stats"
  const [saveMsg, setSaveMsg] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [user, setUser] = useState(null);
  const [authStatus, setAuthStatus] = useState(SUPABASE_CONFIGURED ? "checking" : "unavailable"); // "unavailable"|"checking"|"signedOut"|"sendingCode"|"codeSent"|"verifying"|"signedIn"
  const [authEmail, setAuthEmail] = useState("");
  const [authError, setAuthError] = useState("");
  const [otpCode, setOtpCode] = useState("");
  const [syncMsg, setSyncMsg] = useState("");
  const savedRef = useRef(null);

  // Load saved data on mount
  useEffect(() => {
    loadFromStorage().then(data => {
      setSaved(data);
      setMcMode(!!data.mcMode);
      setQueueMode(data.queueMode !== false);
      setTimerMode(!!data.timerMode);
      setActiveVerbs(new Set(data.activeVerbs));
      setActiveTenses(new Set(data.activeTenses));
      setLoaded(true);
    });
  }, []);

  // Keep body background in sync with the theme (avoids overscroll-bounce flashing the wrong color)
  useEffect(() => {
    document.body.style.background = T.bg;
  }, []);

  // Always-current copy of `saved`, readable from async callbacks (e.g. reconcileWithCloud)
  // without the staleness that a normal closure would have.
  useEffect(() => { savedRef.current = saved; }, [saved]);

  // Cloud reconciliation on sign-in: if this account already has cloud data (signing in on
  // a new device), that data wins and replaces local state; otherwise this is the first-ever
  // sync for the account, so upload whatever's currently on this device to seed it.
  async function reconcileWithCloud(userId) {
    const cloudData = await loadFromCloud(userId);
    if (cloudData) {
      const merged = mergeSaved(cloudData);
      setSaved(merged);
      setMcMode(!!merged.mcMode);
      setQueueMode(merged.queueMode !== false);
      setTimerMode(!!merged.timerMode);
      setActiveVerbs(new Set(merged.activeVerbs));
      setActiveTenses(new Set(merged.activeTenses));
      saveToStorage(merged);
      setSyncMsg("✓ Synced from cloud");
    } else {
      const ok = await saveToCloud(userId, savedRef.current || defSaved());
      setSyncMsg(ok ? "✓ Synced" : "Sync failed");
    }
    setTimeout(() => setSyncMsg(""), 2500);
  }

  // Supabase auth: pick up an existing session on load, and react to sign-in/out events.
  useEffect(() => {
    if (!SUPABASE_CONFIGURED) return;
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        setUser(data.session.user);
        setAuthStatus("signedIn");
        reconcileWithCloud(data.session.user.id);
      } else {
        setAuthStatus("signedOut");
      }
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) {
        setUser(session.user);
        setAuthStatus("signedIn");
        reconcileWithCloud(session.user.id);
      } else if (event === "SIGNED_OUT") {
        setUser(null);
        setAuthStatus("signedOut");
      }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  // Supabase sometimes returns an error with an empty/unhelpful message (e.g. a bare "{}"
  // when the server errors before building a proper error body — a broken SMTP config is
  // the usual cause). Fall back to something a user can actually act on.
  function describeAuthError(error) {
    const msg = error?.message?.trim();
    if (msg && msg !== "{}") return msg;
    return `Sign-in failed${error?.status ? ` (HTTP ${error.status})` : ""} — check your Supabase Auth logs and SMTP settings.`;
  }

  async function sendCode() {
    if (!SUPABASE_CONFIGURED || !authEmail.trim()) return;
    setAuthStatus("sendingCode");
    setAuthError("");
    const { error } = await supabaseClient.auth.signInWithOtp({ email: authEmail.trim() });
    if (error) { setAuthError(describeAuthError(error)); setAuthStatus("signedOut"); }
    else { setAuthStatus("codeSent"); }
  }

  async function verifyCode() {
    if (!otpCode.trim()) return;
    setAuthStatus("verifying");
    setAuthError("");
    const { error } = await supabaseClient.auth.verifyOtp({ email: authEmail.trim(), token: otpCode.trim(), type: "email" });
    // On success, the onAuthStateChange listener picks up the new session, sets authStatus
    // to "signedIn", and runs reconciliation — nothing else to do here.
    if (error) { setAuthError(describeAuthError(error)); setAuthStatus("codeSent"); }
  }

  async function signOut() {
    if (!supabaseClient) return;
    await supabaseClient.auth.signOut();
    setUser(null);
    setAuthStatus("signedOut");
    setOtpCode("");
    setAuthEmail("");
  }

  // Rebuild queue when filters or saved data changes
  useEffect(() => {
    if (!loaded) return;
    const q = queueMode
      ? buildQueueSmart([...activeVerbs], [...activeTenses], saved?.cellStats || {})
      : buildQueue([...activeVerbs], [...activeTenses]);
    setQueue(q);
    setIdx(0);
    setSessionScore(0);
    setSessionWrong(0);
    setStreak(0);
    setAnswered(false);
    setInputVal("");
    setResult(null);
    setShowTable(false);
    setShowNote(false);
  }, [activeVerbs, activeTenses, loaded]);

  const persist = useCallback((newSaved) => {
    saveToStorage(newSaved);
    setSaveMsg("✓ Saved");
    setTimeout(() => setSaveMsg(""), 2000);
    if (user) {
      saveToCloud(user.id, newSaved).then(ok => {
        setSyncMsg(ok ? "✓ Synced" : "Sync failed");
        setTimeout(() => setSyncMsg(""), 2000);
      });
    }
  }, [user]);

  function toggleVerb(v) {
    setActiveVerbs(prev => {
      const next = new Set(prev);
      if (next.has(v)) { if (next.size > 1) next.delete(v); }
      else next.add(v);
      if (saved) {
        const ns = { ...saved, activeVerbs: [...next] };
        setSaved(ns); persist(ns);
      }
      return next;
    });
  }

  function allVerbs() {
    const next = new Set(VERB_KEYS);
    setActiveVerbs(next);
    if (saved) {
      const ns = { ...saved, activeVerbs: [...next] };
      setSaved(ns); persist(ns);
    }
  }

  function toggleTense(t) {
    setActiveTenses(prev => {
      const next = new Set(prev);
      if (next.has(t)) { if (next.size > 1) next.delete(t); }
      else next.add(t);
      if (saved) {
        const ns = { ...saved, activeTenses: [...next] };
        setSaved(ns); persist(ns);
      }
      return next;
    });
  }

  function toggleMcMode() {
    setMcMode(prev => {
      const next = !prev;
      if (saved) { const ns = { ...saved, mcMode: next }; setSaved(ns); persist(ns); }
      return next;
    });
  }

  function toggleQueueMode() {
    setQueueMode(prev => {
      const next = !prev;
      if (saved) { const ns = { ...saved, queueMode: next }; setSaved(ns); persist(ns); }
      return next;
    });
  }

  function toggleTimerMode() {
    setTimerMode(prev => {
      const next = !prev;
      if (saved) { const ns = { ...saved, timerMode: next }; setSaved(ns); persist(ns); }
      return next;
    });
  }

  function submitAnswer(rawValue) {
    if (answered) return;
    const cur = queue[idx];
    if (!cur) return;
    const answer = VERBS[cur.verb][cur.tense][cur.subject];
    const norm = s => s.toLowerCase().replace(/\s+/g, "");
    const ok = norm(rawValue) === norm(answer);
    setInputVal(rawValue);
    setAnswered(true);
    setResult(ok ? "correct" : "wrong");

    setSaved(prev => {
      if (!prev) return prev;
      const vs = { ...prev.verbStats, [cur.verb]: { correct: prev.verbStats[cur.verb].correct + (ok ? 1 : 0), wrong: prev.verbStats[cur.verb].wrong + (ok ? 0 : 1) } };
      const ck = cellKey(cur.verb, cur.tense);
      const prevCell = getCellStat(prev.cellStats, cur.verb, cur.tense);
      const cs = { ...prev.cellStats, [ck]: { correct: prevCell.correct + (ok ? 1 : 0), wrong: prevCell.wrong + (ok ? 0 : 1) } };
      const newStreak = ok ? streak + 1 : 0;
      const ns = { ...prev, allTimeCorrect: prev.allTimeCorrect + (ok ? 1 : 0), allTimeWrong: prev.allTimeWrong + (ok ? 0 : 1), bestStreak: Math.max(prev.bestStreak, newStreak), verbStats: vs, cellStats: cs };
      persist(ns);
      return ns;
    });
    if (ok) { setSessionScore(s => s + 1); setStreak(s => s + 1); }
    else { setSessionWrong(s => s + 1); setStreak(0); }
    setIdx(i => i + 1);
  }

  function checkAnswer() {
    if (answered || !inputVal.trim()) return;
    submitAnswer(inputVal);
  }

  function chooseAnswer(choice) {
    submitAnswer(choice);
  }

  function nextCard() {
    setAnswered(false);
    setInputVal("");
    setResult(null);
    setShowTable(false);
    setShowNote(false);
  }

  function newRound() {
    const q = queueMode
      ? buildQueueSmart([...activeVerbs], [...activeTenses], saved?.cellStats || {})
      : buildQueue([...activeVerbs], [...activeTenses]);
    setQueue(q);
    setIdx(0);
    setSessionScore(0);
    setSessionWrong(0);
    setStreak(0);
    setAnswered(false);
    setInputVal("");
    setResult(null);
    setShowTable(false);
    setShowNote(false);
  }

  function finishSession() {
    setSaved(prev => {
      if (!prev) return prev;
      const totalA = sessionScore + sessionWrong;
      const entry = {
        date: new Date().toISOString(),
        correct: sessionScore, wrong: sessionWrong,
        pct: totalA ? Math.round(sessionScore / totalA * 100) : 0,
        verbs: [...activeVerbs], tenses: [...activeTenses],
      };
      const history = [...(prev.sessionHistory || []), entry].slice(-50);
      const ns = { ...prev, sessions: prev.sessions + 1, sessionHistory: history };
      persist(ns);
      return ns;
    });
  }

  const cur = queue[idx - (answered ? 1 : 0)];
  const correctAnswer = cur ? VERBS[cur.verb][cur.tense][cur.subject] : null;
  const choices = (cur && mcMode) ? buildChoices(cur) : [];
  const isComplete = idx >= queue.length && answered;

  // Runs finishSession exactly once per completed round — isComplete only flips
  // false→true once per round, so this effect only fires on that transition,
  // unlike the old ref-callback pattern which re-fired on every re-render.
  useEffect(() => {
    if (isComplete) finishSession();
  }, [isComplete]);

  const pct = queue.length ? Math.round((Math.min(idx, queue.length) / queue.length) * 100) : 0;
  const totalAnswered = sessionScore + sessionWrong;
  const sessionPct = totalAnswered ? Math.round(sessionScore / totalAnswered * 100) : 0;
  const allTimePct = saved && (saved.allTimeCorrect + saved.allTimeWrong) ? Math.round(saved.allTimeCorrect / (saved.allTimeCorrect + saved.allTimeWrong) * 100) : 0;

  const t = T;
  const cardBg = t.cardBg;
  const border = `1px solid ${t.borderColor}`;

  if (!loaded) return (
    <div style={{ background: t.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: t.textMuted, fontFamily: "'Inter', -apple-system, sans-serif" }}>
      Cargando…
    </div>
  );

  return (
    <div style={{ background: t.bg, minHeight: "100vh", color: t.text, fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", fontSize: 15 }}>

      {/* Header */}
      <div style={{ background: t.headerBg, borderBottom: border, padding: "14px 16px", position: "sticky", top: 0, zIndex: 10, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontWeight: 500, fontSize: 17, letterSpacing: -0.3 }}>
          Spanish <span style={{ color: t.accent }}>Verb</span> Drill
        </div>
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          <button onClick={() => setFiltersOpen(v => !v)} title="Filters" aria-label="Toggle filters" style={{
            width: 30, height: 30, borderRadius: "50%", border: `1px solid ${t.actionBorder}`, cursor: "pointer", fontSize: 14,
            background: filtersOpen ? t.accent : "transparent", color: filtersOpen ? "#fff" : t.tabInactiveText, display: "flex", alignItems: "center", justifyContent: "center", marginRight: 2,
          }} className="theme-toggle">
            <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M40,64H73a32,32,0,0,0,62,0h81a8,8,0,0,0,0-16H135a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16Zm168,60H183a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h81a32,32,0,0,0,62,0h33a8,8,0,0,0,0-16Zm0,76H175a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h73a32,32,0,0,0,62,0h33a8,8,0,0,0,0-16Z"/></svg>
          </button>
          {["drill","stats"].map((p, i) => (
            <button key={p} className="panel-tab" onClick={() => setPanel(p)} style={{
              padding: "5px 13px", borderRadius: 20, fontSize: 12, fontWeight: 600,
              border: "none", cursor: "pointer",
              background: panel === p ? t.accent : t.tabInactiveBg,
              color: panel === p ? "#fff" : t.tabInactiveText,
            }}>{i === 0 ? "Drill" : "Stats"}</button>
          ))}
        </div>
      </div>

      <div style={{ padding: "14px 14px 32px", maxWidth: 620, margin: "0 auto" }}>

        {/* ── Auth bar ── */}
        {SUPABASE_CONFIGURED && (
          <div style={{ background: t.cardBg, borderRadius: 10, padding: "10px 12px", marginBottom: 10, border, fontSize: 12 }}>
            {authStatus === "signedIn" ? (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                <span style={{ color: t.textMuted }}>Signed in as <strong style={{ color: t.text }}>{user?.email}</strong>{syncMsg && ` · ${syncMsg}`}</span>
                <button onClick={signOut} style={{ background: "transparent", border: `1px solid ${t.accent}`, color: t.accent, borderRadius: 8, padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>Sign out</button>
              </div>
            ) : (authStatus === "codeSent" || authStatus === "verifying") ? (
              <div>
                <div style={{ color: t.textMuted, marginBottom: 6 }}>✉️ Enter the code sent to <strong style={{ color: t.text }}>{authEmail}</strong></div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                  <input
                    value={otpCode}
                    onChange={e => setOtpCode(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && verifyCode()}
                    placeholder="6-digit code"
                    inputMode="numeric"
                    autoComplete="one-time-code"
                    disabled={authStatus === "verifying"}
                    style={{ flex: 1, minWidth: 100, fontSize: 12, padding: "6px 8px", borderRadius: 8, border: `1px solid ${t.inputBorder}`, background: t.inputBg, color: t.text, outline: "none" }}
                  />
                  <button onClick={verifyCode} disabled={authStatus === "verifying" || !otpCode.trim()} style={{ background: t.accent, color: "#fff", border: "none", borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                    {authStatus === "verifying" ? "Verifying…" : "Verify code"}
                  </button>
                  <button onClick={() => { setAuthStatus("signedOut"); setOtpCode(""); setAuthError(""); }} style={{ background: "transparent", border: "none", color: t.linkColor, fontSize: 12, cursor: "pointer", textDecoration: "underline", padding: 0 }}>use different email</button>
                </div>
              </div>
            ) : (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                <input
                  value={authEmail}
                  onChange={e => setAuthEmail(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && sendCode()}
                  placeholder="email for cross-device sync…"
                  disabled={authStatus === "sendingCode"}
                  style={{ flex: 1, minWidth: 160, fontSize: 12, padding: "6px 8px", borderRadius: 8, border: `1px solid ${t.inputBorder}`, background: t.inputBg, color: t.text, outline: "none" }}
                />
                <button onClick={sendCode} disabled={authStatus === "sendingCode" || !authEmail.trim()} style={{ background: t.accent, color: "#fff", border: "none", borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {authStatus === "sendingCode" ? "Sending…" : "Send code"}
                </button>
              </div>
            )}
            {authError && <div style={{ color: t.wrongText, marginTop: 6 }}>{authError}</div>}
          </div>
        )}

        {/* ── DRILL PANEL ── */}
        {panel === "drill" && (
          <>
            {/* Filters drawer */}
            {filtersOpen && (
              <div style={{ background: t.cardBg, border, borderRadius: 14, padding: "14px", marginBottom: 12 }}>
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase", color: t.textMuted, marginBottom: 6 }}>Verbs</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 12 }}>
                  {VERB_KEYS.map(v => <FilterBtn key={v} label={v} color={VC[v]} active={activeVerbs.has(v)} onClick={() => toggleVerb(v)} theme={t} />)}
                  <button onClick={allVerbs} style={{ borderRadius: 6, padding: "5px 10px", fontSize: 11, cursor: "pointer", border: `1px solid ${t.inputBorder}`, background: "transparent", color: t.textMuted }}>all</button>
                </div>

                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase", color: t.textMuted, marginBottom: 6 }}>Tenses</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 12 }}>
                  {TENSES.map(ts => <FilterBtn key={ts} label={TL[ts]} color={TC[ts]} active={activeTenses.has(ts)} onClick={() => toggleTense(ts)} theme={t} />)}
                </div>

                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase", color: t.textMuted, marginBottom: 6 }}>Mode</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                  <FilterBtn label={mcMode ? "Multiple choice" : "Type answer"} color={t.accent} active={mcMode} onClick={toggleMcMode} theme={t} />
                  <FilterBtn label={queueMode ? "Smart queue" : "Random queue"} color={t.accent} active={queueMode} onClick={toggleQueueMode} theme={t} />
                  <FilterBtn label={timerMode ? `Timer: ${TIMER_SECONDS}s` : "Timer: off"} color={t.accent} active={timerMode} onClick={toggleTimerMode} theme={t} />
                </div>
              </div>
            )}

            {/* Save indicator + welcome banner */}
            <div style={{ fontSize: 11, color: t.textMuted, textAlign: "right", minHeight: 16, marginBottom: 4 }}>{saveMsg}</div>
            {saved && (saved.allTimeCorrect + saved.allTimeWrong) > 0 && (
              <div style={{ background: t.cardBg, borderRadius: 10, padding: "8px 12px", fontSize: 12, color: t.textMuted, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center", border }}>
                <span>Welcome back! <strong style={{ color: t.text }}>{allTimePct}%</strong> all-time · {saved.sessions} session{saved.sessions !== 1 ? "s" : ""}</span>
                {saved.bestStreak > 0 && <span style={{ whiteSpace: "nowrap" }}>Best: {saved.bestStreak} 🔥</span>}
              </div>
            )}

            {/* Progress bar */}
            <div style={{ height: 3, background: t.borderColor, borderRadius: 2, marginBottom: 10, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${pct}%`, background: t.accent, borderRadius: 2, transition: "width .4s" }} />
            </div>

            {/* Session stats */}
            <div className="stat-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 12 }}>
              <StatBox num={sessionScore} label="correct" theme={t} />
              <StatBox num={sessionWrong} label="wrong" theme={t} />
              <StatBox num={streak} label="streak 🔥" theme={t} />
              <StatBox num={Math.max(0, queue.length - idx)} label="left" theme={t} />
            </div>

            {/* ── Card ── */}
            {isComplete ? (
              <div style={{ background: cardBg, borderRadius: 14, padding: "2rem 1.25rem", border, textAlign: "center" }}>
                <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}>
                  <ProgressRing pct={sessionPct} theme={t} />
                </div>
                <div style={{ fontSize: 20, fontWeight: 500, marginBottom: 6 }}>Round complete!</div>
                <div style={{ fontSize: 14, color: t.textMuted, marginBottom: 4 }}>{sessionScore}/{totalAnswered} correct this session ({sessionPct}%)</div>
                {saved && <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 20 }}>All-time: {saved.allTimeCorrect} correct / {saved.allTimeWrong} wrong</div>}
                <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
                  <button onClick={newRound} style={{ background: t.accent, color: "#fff", border: "none", borderRadius: 10, padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>New round</button>
                  <button onClick={() => setPanel("stats")} style={{ background: t.statBg, color: t.outlineText, border, borderRadius: 10, padding: "10px 16px", fontSize: 13, cursor: "pointer" }}>View stats</button>
                </div>
              </div>
            ) : cur ? (
              <div style={{ background: cardBg, borderRadius: 14, padding: "1.25rem", border }}>
                {/* Verb header */}
                <div style={{ display: "flex", flexWrap: "wrap", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: 26, fontWeight: 500 }}>{cur.verb}</span>
                  <Pill label={TL[cur.tense]} color={TC[cur.tense]} />
                </div>
                <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 12 }}>{VERBS[cur.verb].en}</div>

                {/* Prompt */}
                <div style={{ fontSize: 14, color: t.textMuted, lineHeight: 1.6, marginBottom: 12 }}>
                  {(PROMPTS[cur.verb]?.[cur.tense]?.[cur.subject] || `Conjugate ${cur.verb} for ${cur.subject}`).split("_____").map((part, i, arr) => (
                    <span key={i}>{part}{i < arr.length - 1 && <strong style={{ color: t.text }}>_____</strong>}</span>
                  ))}
                </div>
                <div style={{ fontSize: 12, color: t.textMuted, marginBottom: 10 }}>
                  Subject: <strong style={{ color: t.text, fontSize: 14 }}>{cur.subject}</strong>
                </div>

                {timerMode && !answered && (
                  <TimerBar key={idx} duration={TIMER_SECONDS} onExpire={() => submitAnswer("")} theme={t} />
                )}

                {/* Input */}
                {mcMode ? (
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                    {choices.map(choice => {
                      const isCorrectChoice = choice === correctAnswer;
                      const isPicked = answered && inputVal === choice;
                      let bg = t.inputBg, border = t.inputBorder;
                      if (answered && isCorrectChoice) { bg = t.correctBg; border = t.correctBorder; }
                      else if (isPicked) { bg = t.wrongBg; border = t.wrongBorder; }
                      return (
                        <button key={choice} disabled={answered} onClick={() => chooseAnswer(choice)} className="action-btn" style={{
                          padding: "12px 10px", borderRadius: 10, fontSize: 16, fontWeight: 600,
                          cursor: answered ? "default" : "pointer",
                          border: `1.5px solid ${border}`, background: bg, color: t.text,
                        }}>{choice}</button>
                      );
                    })}
                  </div>
                ) : (
                  <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                    <input
                      value={inputVal}
                      onChange={e => setInputVal(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && checkAnswer()}
                      disabled={answered}
                      autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
                      placeholder="type conjugation…"
                      style={{
                        flex: 1, fontSize: 17, padding: "10px 12px", borderRadius: 10,
                        border: `1.5px solid ${result === "correct" ? t.correctBorder : result === "wrong" ? t.wrongBorder : t.inputBorder}`,
                        background: result === "correct" ? t.correctBg : result === "wrong" ? t.wrongBg : t.inputBg,
                        color: t.text, outline: "none",
                      }}
                    />
                    <button onClick={checkAnswer} style={{ background: t.accent, color: "#fff", border: "none", borderRadius: 10, padding: "10px 16px", fontSize: 14, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>Check</button>
                  </div>
                )}

                {/* Feedback */}
                {answered && (
                  <div style={{
                    borderRadius: 10, padding: "10px 12px", fontSize: 13, lineHeight: 1.6, marginBottom: 8,
                    background: result === "correct" ? t.correctFeedbackBg : t.wrongFeedbackBg,
                    borderLeft: `3px solid ${result === "correct" ? t.correctBorder : t.wrongBorder}`,
                    color: result === "correct" ? t.correctText : t.wrongText,
                  }}>
                    {result === "correct"
                      ? <>✓ ¡Correcto! <strong style={{ color: t.text }}>{VERBS[cur.verb][cur.tense][cur.subject]}</strong></>
                      : <>✗ Answer: <strong style={{ color: t.text }}>{VERBS[cur.verb][cur.tense][cur.subject]}</strong> — {inputVal ? `you ${mcMode ? "picked" : "wrote"} "${inputVal}"` : "time's up!"}</>
                    }
                  </div>
                )}

                {/* Pattern note */}
                {showNote && (
                  <div style={{ background: t.noteBg, borderLeft: `3px solid ${t.noteBorder}`, borderRadius: 10, padding: "10px 12px", fontSize: 13, color: t.noteText, lineHeight: 1.6, marginBottom: 8 }}>
                    {VERBS[cur.verb].note}
                  </div>
                )}

                {/* Table toggle */}
                <button onClick={() => setShowTable(v => !v)} style={{ background: "none", border: "none", color: t.linkColor, fontSize: 12, cursor: "pointer", textDecoration: "underline", padding: "4px 0", display: "block", marginBottom: 4 }}>
                  {showTable ? "hide table ▴" : "see conjugation table ▾"}
                </button>
                {showTable && <ConjTable verb={cur.verb} theme={t} />}

                {/* Action row */}
                {answered && (
                  <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
                    <button className="action-btn" onClick={nextCard} style={{ background: t.accent, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Next →</button>
                    <button className="action-btn" onClick={() => setShowNote(v => !v)} style={{ background: "transparent", border: `1.5px solid ${t.actionBorder}`, color: t.textMuted, borderRadius: 10, padding: "10px 14px", fontSize: 13, cursor: "pointer" }}>
                      {showNote ? "hide note" : "why?"}
                    </button>
                  </div>
                )}
              </div>
            ) : null}
          </>
        )}

        {/* ── STATS PANEL ── */}
        {panel === "stats" && saved && (
          <>
            <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.07em", color: t.textMuted, marginBottom: 8 }}>Accuracy by verb</div>
            {VERB_KEYS.map(v => {
              const s = saved.verbStats[v];
              const tot = s.correct + s.wrong;
              const p = tot ? Math.round(s.correct / tot * 100) : 0;
              const barColor = pctColor(p, t);
              return (
                <div key={v} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: `1px solid ${t.rowBorder}` }}>
                  <span style={{ width: 62, fontSize: 13, fontWeight: 700, color: VC[v], flexShrink: 0 }}>{v}</span>
                  <div style={{ flex: 1, height: 6, background: t.borderColor, borderRadius: 3, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${tot ? p : 0}%`, background: barColor, borderRadius: 3, transition: "width .5s" }} />
                  </div>
                  <span style={{ fontSize: 12, color: t.textMuted, width: 34, textAlign: "right", flexShrink: 0 }}>{tot ? `${p}%` : "—"}</span>
                  <span style={{ fontSize: 11, color: t.textMuted, width: 48, textAlign: "right", flexShrink: 0 }}>{s.correct}/{tot}</span>
                </div>
              );
            })}

            <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.07em", color: t.textMuted, marginTop: 20, marginBottom: 8 }}>All-time</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 6 }}>
              <StatBox num={saved.allTimeCorrect} label="correct" theme={t} />
              <StatBox num={saved.allTimeWrong} label="wrong" theme={t} />
              <StatBox num={saved.sessions} label="sessions" theme={t} />
              <StatBox num={saved.bestStreak} label="best streak 🔥" theme={t} />
            </div>

            <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.07em", color: t.textMuted, marginTop: 20, marginBottom: 8 }}>Session trend</div>
            <div style={{ background: t.cardBg, borderRadius: 10, padding: "10px 12px", border }}>
              <SessionChart history={saved.sessionHistory} theme={t} />
            </div>

            <button onClick={() => {
              if (confirm("Reset all stats? This cannot be undone.")) {
                const ns = { ...defSaved(), mcMode, queueMode, timerMode };
                setSaved(ns); setActiveVerbs(new Set(ns.activeVerbs)); setActiveTenses(new Set(ns.activeTenses));
                saveToStorage(ns); setPanel("drill");
              }
            }} style={{ marginTop: 16, width: "100%", background: "none", border: `1px solid ${t.resetBorder}`, color: t.textMuted, borderRadius: 10, padding: "9px", fontSize: 13, cursor: "pointer" }}>
              Reset all stats
            </button>
          </>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
